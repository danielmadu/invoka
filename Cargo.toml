[package]
name = "invoka"
version = "0.2.0"
edition = "2021"
description = "Minimal Raycast-style launcher for Linux and Windows"
license = "MIT"

[[bin]]
name = "invoka"
path = "src/main.rs"

[features]
# Opt-in wlr-layer-shell support (Hyprland, sway, wlroots). Requires the
# LayerShellQt development package at build time; falls back to a plain
# floating window at runtime when the compositor has no layer shell.
layer-shell = ["dep:pkg-config"]

[target.'cfg(windows)'.dependencies]
# Start Menu .lnk parsing (pure Rust)
parselnk = "0.1"
# Named pipes IPC, hotkey message loop and HICON extraction
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# PNG encoding for the icon cache
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
nucleo = "0.5"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
global-hotkey = "0.8"
# Theme hot-reload
notify = "8"

[build-dependencies]
# Required for linking the Qt object files into the final binary
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }
# Used by the `layer-shell` feature to locate LayerShellQt
pkg-config = { version = "0.3", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
