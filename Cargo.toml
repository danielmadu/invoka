[package]
name = "invoka"
version = "0.1.0"
edition = "2021"
description = "Minimal Raycast-style launcher for Linux and Windows"
license = "MIT"

[[bin]]
name = "invoka"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
nucleo = "0.5"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
global-hotkey = "0.8"

[build-dependencies]
# Required for linking the Qt object files into the final binary
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
