name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package (zip)
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if (-not $tag.StartsWith("v")) { $tag = "v0.0.0-dev" }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/invoka.exe dist/
          Compress-Archive -Path dist/invoka.exe `
            -DestinationPath "dist/invoka-$tag-x86_64-windows.zip"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${env:GITHUB_REF_NAME}" dist/*.zip --clobber `
            --repo "${env:GITHUB_REPOSITORY}"
